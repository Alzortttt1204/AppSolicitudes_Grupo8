spring.application.name=ms-solicitudes

# Puerto del microservicio (el emulador lo ve como http://10.0.2.2:8080)
server.port=8080

# Base de datos H2 guardada en el archivo ./data/solicitudesdb (los datos no se pierden al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/solicitudesdb
spring.datasource.username=sa
spring.datasource.password=

# JPA crea y actualiza la tabla "solicitudes" a partir de la clase Solicitud
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web para ver la tabla: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/solicitudesdb  usuario: sa  clave: vacía)
spring.h2.console.enabled=true
